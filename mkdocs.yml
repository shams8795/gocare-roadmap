site_name: GoCare Roadmap
site_description: Requirements analysis for the GoCare roadmap features.
site_author: Shams Abdelhalim

theme:
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
